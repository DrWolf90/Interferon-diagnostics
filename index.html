<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>InterferOn Diagnostics</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #05080d;
      color: white;
      min-height: 100vh;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 30px 7%;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
    }

    .logo span {
      font-weight: 300;
    }

    .hero {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 7%;
      max-width: 1100px;
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 13px;
      margin-bottom: 25px;
      opacity: 0.7;
    }

    h1 {
      font-size: clamp(50px, 8vw, 100px);
      line-height: 0.98;
      letter-spacing: -4px;
      margin-bottom: 35px;
    }

    .hero p {
      font-size: clamp(18px, 2vw, 25px);
      line-height: 1.5;
      max-width: 720px;
      color: #b8c0cc;
    }

    .button {
      display: inline-block;
      width: fit-content;
      margin-top: 40px;
      padding: 16px 26px;
      border: 1px solid white;
      border-radius: 30px;
      color: white;
      text-decoration: none;
      transition: 0.3s;
    }

    .button:hover {
      background: white;
      color: #05080d;
    }
  </style>
</head>

<body>

  <nav>
    <div class="logo">
      InterferOn <span>Diagnostics</span>
    </div>
  </nav>

  <main class="hero">

    <div class="eyebrow">
      Precision Immune Diagnostics
    </div>

    <h1>
      Decode<br>
      inflammation.
    </h1>

    <p>
      Quantitative interferon profiling combined with intelligent
      data interpretation to enable a new generation of immune
      stratification.
    </p>

    <a class="button" href="#technology">
      Discover our technology →
    </a>

  </main>

</body>
</html>
